[project]
name = "mycontext"
version = "0.1.0"
description = "A private context layer for AI: your data is scrubbed on your Mac before any AI can read it. Gmail is the first source."
requires-python = ">=3.11"
dependencies = [
    "phonenumbers>=8.13",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
    "keyring>=25",
    "openai>=1.60",
    "pywebview>=5.0",
]

[project.scripts]
mycontext = "mycontext.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

# --- Mac app packaging (Briefcase) -------------------------------------------
# See packaging/README.md. Run Briefcase from Python 3.12 so the bundled
# runtime is 3.12 (the project needs 3.11+).
[tool.briefcase]
project_name = "MyContext"
bundle = "com.example"            # TODO: your reverse-DNS domain
version = "0.1.0"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]

[tool.briefcase.app.mycontext]
formal_name = "MyContext"
description = "A private context layer for AI. Your data, scrubbed on your Mac."
sources = ["src/mycontext"]
requires = [
    "phonenumbers>=8.13",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
    "keyring>=25",
    "openai>=1.60",
    "pywebview>=5.0",
]

[tool.briefcase.app.mycontext.macOS]
universal_build = true
# cryptography 49+ ships no Intel Mac wheels; 48.x is the last universal2 build.
# Drop this pin (and set universal_build = false) once Intel Macs are dropped.
# No std-nslog: it would redirect stdout to the system log, and the bundled
# launcher also serves MCP over stdio (`MyContext --data-dir … mcp`).
requires = ["cryptography<49"]
# Universal builds accept wheels only, and pywebview's dependency proxy_tools
# ships only a source archive. Build its wheel first (see packaging/README.md):
#   .venv312/bin/pip wheel --no-deps -w packaging/wheels proxy_tools
requirement_installer_args = ["--find-links", "packaging/wheels"]
