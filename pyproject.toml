[project]
name = "safecontext"
version = "0.1.4"
description = "A private context layer for AI: your data is scrubbed on your Mac before any AI can read it. Gmail is the first source."
requires-python = ">=3.11"
dependencies = [
    "phonenumbers>=8.13",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
    "keyring>=25",
    "websockets>=15",
    "pywebview>=5.0",
    "certifi>=2024.2",  # CA list for the bundled Python; see safecontext/tls.py
]

[project.scripts]
safecontext = "safecontext.cli:main"
mycontext = "safecontext.cli:legacy_main"  # deprecated alias from before the rename

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

# --- Mac app packaging (Briefcase) -------------------------------------------
# See packaging/README.md. Run Briefcase from Python 3.12 so the bundled
# runtime is 3.12 (the project needs 3.11+).
[tool.briefcase]
project_name = "SafeContext"
bundle = "me.safecontext"         # bundle ID me.safecontext.safecontext
version = "0.1.4"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]

[tool.briefcase.app.safecontext]
formal_name = "SafeContext"
description = "A private context layer for AI. Your data, scrubbed on your Mac."
sources = ["src/safecontext"]
requires = [
    "phonenumbers>=8.13",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
    "keyring>=25",
    "websockets>=15",
    "pywebview>=5.0",
    "certifi>=2024.2",  # CA list for the bundled Python; see safecontext/tls.py
]

[tool.briefcase.app.safecontext.macOS]
# Apple silicon (M1 or later) only. Every Apple silicon Mac shipped with
# macOS 11, which is also the floor of the bundled Python 3.12 support package
# and of every bundled wheel (pywebview's pyobjc wheels need 10.13).
universal_build = false
min_os_version = "11.0"
# No std-nslog: it would redirect stdout to the system log, and the bundled
# launcher also serves MCP over stdio (`SafeContext --data-dir … mcp`).
# Briefcase installs macOS requirements as wheels only, and pywebview's
# dependency proxy_tools ships only a source archive. Build its wheel first
# (see packaging/README.md):
#   .venv312/bin/pip wheel --no-deps -w packaging/wheels proxy_tools
requirement_installer_args = ["--find-links", "packaging/wheels"]
