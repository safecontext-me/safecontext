# Deploys the website to the "safecontext" Cloudflare Pages project whenever main changes it.
# Same as running `npx wrangler pages deploy --branch main` from the repo root: wrangler.toml
# points Pages at site/ for static files, and the deploy also picks up functions/ (/download)
# and the R2 binding DOWNLOADS -> safecontext-downloads. relay/ is not deployed here.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account: Cloudflare Pages: Edit and
# Workers R2 Storage: Read) and CLOUDFLARE_ACCOUNT_ID. Without them the job skips the deploy
# with a notice instead of failing.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "functions/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Site deploy skipped::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repository secrets are not set. See packaging/README.md."
          fi

      - name: Check out
        if: steps.secrets.outputs.ready == 'true'
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        # cloudflare/wrangler-action v3.15.0
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.167.0"
          workingDirectory: "."
          command: pages deploy --branch main
